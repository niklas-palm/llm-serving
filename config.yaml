# =============================================================================================
# The only file you need to edit.
#
# Minimum: region, instanceType, modelId. Everything else has a default. GPU count, host RAM,
# container memory, tensor-parallel degree and engines per instance are derived from instanceType.
#
# Comments say what a setting does and the one trap to know about. Measurements and reasoning are in
# docs/tuning.md; each setting names its section.
#
# Values you do not want to commit (API key, account-specific image URI) go in config.local.yaml,
# gitignored and deep-merged over this file. SERVING_IMAGE and API_KEY in the environment override both, for a
# pipeline that builds and deploys in one run. An empty variable counts as unset. `region` is not
# settable from the environment; see infra/app.py.
#
# The endpoint needs no configuration: a CloudFront HTTPS URL in front of an internal load balancer.
# One limit: a non-streamed answer must finish within 120 s. Streamed answers have no limit.
# README.md, "Access".
# =============================================================================================

# ---------------------------------------------------------------------------- deployment

# g7e is not offered in every region. Check first:
#   aws ec2 describe-instance-type-offerings --region <region> \
#     --location-type availability-zone --filters Name=instance-type,Values=g7e.2xlarge
region: us-west-2

# Optional. Confine the VPC, and so the GPU instances, to these zones.
# Empty spans up to four zones. Set it when a zone lacks the type (us-east-2: three zones, g7e in two)
# to avoid failed launch attempts there. At least two; the load balancer needs two subnets. Spot
# capacity often exists in only one of them, so the fleet ends up in one zone; that is fine.
#   availabilityZones: ["us-east-2a", "us-east-2b"]
availabilityZones: []

# ---------------------------------------------------------------------------- fleet

# g7e.2xlarge | 4xlarge | 8xlarge | 12xlarge | 24xlarge | 48xlarge. Same 96 GiB GPU in every size;
# larger sizes add GPUs, vCPU and host RAM. Also p5.4xlarge and p5.48xlarge (H100, 80 GiB) for a
# comparison; every number in the docs is g7e, and NVFP4 checkpoints need Blackwell. Anything else is
# rejected at synth.
# For a model that fits one GPU, the smallest size is the best value.
# docs/tuning.md, "For a model that fits one GPU, buy the smallest instance".
instanceType: g7e.2xlarge

# Instance count, and the minimum when autoscaling is on. 0 parks the deployment (see maxInstanceCount).
#
# 16 = the GPU count of two g7e.48xlarge for about 20% less money. It covers this example workload:
#   ~1,000 input tokens at ~70 req/s, 8 s budget       ->  70,000 input tok/s
#   ~2,600 input tokens at ~65 req/s, 20-25 s budget   -> 170,000 input tok/s
# One GPU sustains ~16,000 input tok/s inside an 8 s p95 (single-instance figure at its latency knee,
# 16,075 measured). 16 GPUs = ~256,000 against 240,000 needed, 7% spare, so maxInstanceCount leaves
# room above it.
#
# Two fleets would cost 14, not 16. One endpoint has one latency budget, so the whole fleet meets the
# strictest one. At a 20-25 s budget a GPU sustains ~27,600 input tok/s, so split by budget it is
# 6 + 8 = 14. Deploy this stack twice if the shapes are separable.
# docs/tuning.md, "Sizing a fleet, and when to autoscale".
#
# Quota: 16 instances is 128 vCPU. The default `All G and VT Spot` quota (L-3819A6DF) is 64 and the
# on-demand G quota is often lower, so request an increase before this will launch. For a first look,
# set 1-2.
#
# Size for steady-state demand with headroom. Autoscaling is too slow to lean on.
instanceCount: 16

# Autoscaling ceiling. Equal to instanceCount, or omitted, means a fixed fleet and no scaling policy.
# To park: set this AND instanceCount to 0. Zeroing one of them is rejected at synth.
# Autoscaling is burst insurance, not a saving: ~11 minutes to usable capacity, scale-in one step at a
# time, and the instance outlives its task by ~15 minutes. Headroom here also changes how a redeploy
# behaves: with a spare instance ECS replaces engines one at a time; without, it takes them down for
# the reload. README.md, "Changing the model, tuning or image later".
# docs/tuning.md, "What autoscaling actually does, measured".
maxInstanceCount: 24

# Requests/minute per task at which to add capacity. Scales on the load balancer's
# RequestCountPerTarget, a leading indicator.
#
# Expect to change this. Request rate scales inversely with prompt length while tokens/s per GPU stays
# roughly constant (17.2 req/s per GPU at 1,000 tokens, 4.2 at 4,000). Derivation:
#   one GPU sustains ~16,000 input tok/s inside an 8 s p95
#   / your average input tokens per request  -> req/s per task
#   x 60 x 0.85                              -> threshold
# 1,000-token prompts: ~870. The mixed workload above averages ~1,780 tokens: 16,000 / 1,780 = 9.0,
# x 60 x 0.85 = 460; the shipped 445 is the same sum from the 15,500 tok/s measured the day it was set.
# Split the fleet by shape and the thresholds are ~870 and ~315.
#
# Blind spot: request count ignores request cost. A hundred short and a hundred long requests look
# the same here.
# docs/tuning.md, "scalingRequestsPerTarget: derive it, do not inherit it".
scalingRequestsPerTarget: 445

# Pin each client's session to one engine with a load balancer cookie (one hour). Prefix caching is per
# engine, so without this the next turn of a conversation hits its cached prefix about 1/N of the time
# on N engines: measured 21% against 75% hit rate and +14% throughput on eight engines. Turn it on
# when your clients keep cookies per end-user conversation. Leave it off when one upstream service
# calls with a single cookie jar: it would pin all of its traffic to one engine.
# docs/tuning.md, "Prefix caching is a routing decision".
stickySessions: false

# Spot: cheaper, and often the only way to get this GPU class. A spot g7e.2xlarge launched in 22 s
# after 300+ on-demand failures for larger sizes. Off by default because interruption is real.
# Two traps: spot has a separate vCPU quota (L-3819A6DF, default 64), and suspending ASG processes to
# protect an instance also stops the ASG replacing it when spot reclaims it.
# README.md, "Spot and instance protection".
useSpot: false

# ---------------------------------------------------------------------------- observability

# Every deployment gets a CloudWatch dashboard and two alarms (engines unhealthy, load balancer
# erroring), plus a latency alarm if latencyAlarmSeconds is set. Top rows: load balancer and ASG
# metrics. Bottom three rows: engine metrics from a sidecar in every task (queue depth, batch occupancy,
# KV cache usage, preemptions, time to first token, request time, tokens in and out per request,
# requests by size band, prefix cache hit rate). Ten metrics plus one series per band edge plus one,
# about $7 a month with the shipped bands.
# scripts/endpoint_info.py prints the dashboard URL.
# docs/tuning.md, "Watching a running fleet" and "Engine metrics".

# Optional. Alarm when p95 response time stays above this for 3 minutes, and draw it on the latency
# graph. 0 = off. No default: set it to what "too slow" means for your callers.
latencyAlarmSeconds: 0

# SNS topic ARN to notify when an alarm fires. Empty: alarms still change state in the console, nobody
# is paged. No topic is created for you.
alarmTopicArn: ""

# Optional. Size bands for the two request-shape widgets, as ascending edges: the bands are "up to the
# first edge", edge to edge, then "last edge and more". Each edge must be one of the engine's histogram
# edges: 1 2 5 10 20 50 100 200 500 1000 2000 5000 10000 20000 50000 100000 200000; anything else is
# rejected at synth. Fewer edges means fewer lines and fewer metric series (one per edge plus one).
# docs/tuning.md, "Request-size bands".
promptTokenBands: [500, 1000, 2000, 5000, 10000, 20000]
outputTokenBands: [100, 200, 500, 1000, 2000]

# ---------------------------------------------------------------------------- model

# Any Hugging Face repo id vLLM supports. Also the model name clients send and /v1/models returns.
#
# The weights you pick are a speed and cost decision, not a given. For this model, measured on this GPU
# with unique 1,000-token prompts (docs/tuning.md has every number):
#
#   Qwen/Qwen3-30B-A3B-Instruct-2507      bf16, 57 GiB, + quantization: "fp8" below     shipped default
#   Qwen/Qwen3-30B-A3B-Instruct-2507-FP8  publisher's fp8, 29 GiB, quantization: ""      same speed, half the download
#   nvidia/Qwen3-30B-A3B-NVFP4            calibrated 4-bit, 17 GiB, quantization: ""     +25-28% tok/s, but a different base model (see docs)
#   + EAGLE-3 speculator via extraArgs (see below)                                        +24-41% tok/s on any of them
#
# bf16 without quantization measured 55 to 63% of fp8's throughput and is the choice only on quality grounds.
modelId: Qwen/Qwen3-30B-A3B-Instruct-2507

# Optional. For gated repos (Llama, Gemma): the name of a Secrets Manager secret holding your Hugging
# Face token. Create it once, then set the name here or in config.local.yaml:
#   aws secretsmanager create-secret --region <region> --name gpu-llm-serving/hf-token --secret-string "$HF_TOKEN"
#   hfTokenSecretName: gpu-llm-serving/hf-token
# The token reaches the engine as HF_TOKEN and never enters the template, outputs or logs. Set it for
# public models too: eight instances pulling anonymously at once hit HTTP 429 from Hugging Face, and one
# engine died mid-download. The account behind the token must have accepted a gated model's licence
# (403 otherwise).
hfTokenSecretName: ""

# Set this if your model is not roughly 30B parameters. The tensor-parallel degree is derived from it.
# A 70B model left at 30 derives tensorParallel: 1, deploys, and runs out of VRAM loading weights.
# `cdk synth` prints the assumed size and the degree it chose. Count parameters, not file size.
estimatedParamsBillions: 30


# "fp8" quantizes at load time. Empty keeps the model's native precision.
# Largest single effect available: bf16 measured 7,903 input tok/s per GPU against 15,941 for fp8,
# about 2x the fleet for the same work. Prefer a publisher's official FP8 build as modelId when one
# exists, and clear this when the build declares its own method: Red Hat's fp8 builds (Gemma 4, others)
# are `compressed-tensors`, and vLLM refuses to start when that differs from this flag ("Quantization
# method specified in the model config (compressed-tensors) does not match ... (fp8)"). Qwen's own -FP8
# builds declare fp8 and accept either. If you clear this for bf16 weights, set kvCacheDtype: auto below.
# NVFP4 measured another +25% over fp8 on this GPU but needs a calibrated checkpoint (set modelId to the
# publisher's NVFP4 build and clear this): vLLM's load-time "nvfp4_per_token" refuses this GPU (it wants
# SM100, the B200). A 27B NVFP4 build scored within noise of bf16 on gsm8k; one task, so fp8 stays the default.
# docs/tuning.md, "Quantisation is two independent decisions" and "NVFP4".
quantization: "fp8"

# Optional. Tool calling, which every agent framework relies on. The parser turns the model's tool-call
# text into the API's tool_calls field; it is per model family: hermes (Qwen3), qwen3_coder (Qwen3-Coder),
# openai (gpt-oss), gemma4 (Gemma 4), llama3_json (Llama 3.x), mistral (Mistral). `vllm serve --help` lists them all.
# Empty: a request that carries `tools` gets plain text back and the agent stalls on its first step.
# docs/tuning.md, "Tool calling".
toolCallParser: ""

# Optional. For a thinking model served with thinking on: moves the chain of thought into the
# response's reasoning_content so clients get the answer, not the deliberation. qwen3 (Qwen3),
# openai_gptoss (gpt-oss), gemma4 (Gemma 4), deepseek_r1. Not needed with thinking off (see extraArgs below),
# except for Gemma 4: it writes an empty thought block after a tool turn even with thinking off, and without
# the parser that block lands in the answer text. Set it whenever toolCallParser is gemma4.
reasoningParser: ""

# Optional. Flags appended to `vllm serve`, for anything this project does not model. Split like a
# shell command line, so quote as you would in a shell; a JSON value needs single quotes around it:
#   extraArgs: --data-parallel-size 2
#   extraArgs: --speculative-config '{"method":"eagle3","model":"<speculator repo>","num_speculative_tokens":3}'
# Unvalidated. The container logs the full command it runs. Do not leave `--enforce-eager` here
# beyond diagnosing a startup problem: -85% decode. docs/tuning.md, "Speculative decoding with EAGLE-3".
extraArgs: ""

# Optional. Environment variables for the engine process, for the knobs vLLM exposes only that way
# (kernel backends, attention backend, download behaviour). A model card's recipe often names them.
#   extraEnv:
#     VLLM_USE_FLASHINFER_MOE_FP4: "0"
# Unvalidated beyond the names. Empty: none.
extraEnv: {}

# ---------------------------------------------------------------------------- tuning
#
# Leave these unless you have a reason; docs/tuning.md has the numbers behind each one.
tuning:
  # 0 = derive the smallest degree whose combined VRAM holds the model.
  # Tensor parallelism makes a model fit across GPUs. It does not make a fitting model faster, and a
  # model that needs several GPUs still wants the smallest degree that fits: on eight GPUs, two engines
  # at TP=4 measured 22.5 req/s against 13.4 for one engine at TP=8, same model, same load.
  # Block-quantised FP8 checkpoints refuse degrees that split an expert into partial 128-wide tiles.
  # docs/tuning.md, "Tensor parallelism" and "Topology".
  tensorParallel: 0

  # Max tokens per request, input + output. 0 = the model's own maximum.
  # Lowering it frees nothing (KV cache is allocated in blocks on demand). Use it only to reject
  # over-long requests. One exception: on a card the weights nearly fill, the engine will not start
  # unless the KV left holds one request of this length; lower it then (a 57 GB bf16 model on an 80 GB
  # card needed 32768). docs/tuning.md, "maxModelLen".
  maxModelLen: 0

  # Ceiling on concurrent sequences per engine, not a reservation; N engines hold N x this. Keep it
  # above the concurrency each engine will see, or the flag is what you measure: one TP=8 engine given
  # 512 requests queued half of them.
  maxNumSeqs: 256

  # Token budget per scheduler step. 0 = engine default. No measured effect from 8k to 64k, on one GPU
  # or on a prefill-bound TP=4 engine.
  maxNumBatchedTokens: 0

  # Fraction of each GPU vLLM may claim. 0.95 measured +27% over the 0.90 default (the KV cache is
  # what remains after the weights). 0.97 gained +1.6% and crashed a dense model under load.
  # Leave at 0.95 with unquantised weights too; the fix for that case is kvCacheDtype: auto.
  # docs/tuning.md, "gpuMemoryUtilization: 0.95".
  gpuMemoryUtilization: 0.95

  # KV cache precision, independent of weight precision. "fp8" measured +12% decode, growing with
  # concurrency. "auto" keeps the model's precision.
  # On this GPU (FlashInfer attention) fp8 won every shape, long cached prompts included (+18 to 39%).
  # On H100s (FlashAttention) the same shape ran 20 to 30% faster with "auto". Kernel-dependent, so
  # measure it on yours. docs/tuning.md, "kvCacheDtype".
  # With unquantised weights use "auto": fp8 packs more tokens in, batches grow, and it runs out of
  # VRAM under load. `cdk synth` warns when the weights fill more than half the card.
  kvCacheDtype: fp8

  # Reuse attention state across requests sharing a prompt prefix. Leave on: -1.2% when nothing
  # shares a prefix. Figures in the docs are unique-prompt; every prompt cached measured +46% on 1k
  # prompts and 2.7x on 4k prompts for the MoE, and nothing on a dense model (decode is its wall).
  # docs/tuning.md, "Choosing an operating concurrency".
  enablePrefixCaching: true

  # Mixture-of-experts only: pin whole experts to GPUs instead of sharding each across them.
  # Measured -13% in FP8 and +15% in bf16 on two GPUs; -7 to -20% in bf16 on eight. Measure it: one
  # flag, one restart. Required for block-quantised FP8 at a degree that would split an expert's tiles.
  enableExpertParallel: false

  # Mixture-of-experts only, with enableExpertParallel on: attention groups inside ONE engine, each with
  # its own request batch, sharing the experts sharded across all of the engine's tensorParallel x
  # dataParallel GPUs. The load balancer then sees one target per engine. 1 = off. Refused without
  # expert parallelism, where it is only replicas with more overhead.
  # docs/tuning.md, "Topology: replicas or tensor parallelism?".
  dataParallel: 1

  # Independent engines per instance, load-balanced by the ALB.
  # 0 = GPUs / tensorParallel, one engine per GPU. Measured best topology: splitting one model across
  # GPUs puts them in lockstep with an all-reduce per layer. Host memory is divided by this number.
  # docs/tuning.md, "Topology: replicas or tensor parallelism?".
  replicas: 0
